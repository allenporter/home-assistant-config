---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
        args:
          - --allow-multiple-documents
        # Can't handle home assistant constructors
        exclude: ^config/.*
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-project ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or:
          - python
          - pyi
      - id: ruff-format
        name: ruff format
        entry: uv run --no-project ruff format
        language: system
        types_or:
          - python
          - pyi
      - id: ty
        name: ty check
        entry: uv run --no-project ty check . --ignore unresolved-import
        language: system
        pass_filenames: false
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=hass,iff,iif
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args:
          - -c
          - ".yaml-lint.yaml"
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
